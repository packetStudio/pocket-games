name: Auto Scaffold Pocket Games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scaffold App
        run: |
          git config --global user.name "packetStudio-bot"
          git config --global user.email "bot@packetstudio.com"

          # Create app in a clean temp folder
          npx create-expo-app@latest temp-app --template blank-typescript --yes

          # Copy everything into root
          shopt -s dotglob
          cp -rn temp-app/* .
          rm -rf temp-app

          # Install packages
          npx expo install react-native-svg react-native-screens react-native-safe-area-context @react-navigation/native @react-navigation/native-stack
          npm install firebase

          # Create folder architecture
          mkdir -p src/config src/core/multiplayer src/core/chat src/navigation src/screens src/games/bhag-buggu-bhag/engine src/games/bhag-buggu-bhag/components src/games/bhag-buggu-bhag/screens assets/games/bhag-buggu-bhag

          # Create game registry
          cat << 'EOF' > src/config/gamesRegistry.ts
          export interface GameMeta {
            id: string;
            title: string;
            subtitle: string;
            badgeText: string;
            routeKey: string;
          }

          export const GAMES_REGISTRY: GameMeta[] = [
            {
              id: 'bhag-buggu-bhag',
              title: 'Bhag Buggu Bhag',
              subtitle: 'Catch the Thief (Node Chase)',
              badgeText: 'Classic',
              routeKey: 'BhagBugguBhagModes',
            },
          ];
          EOF

          # Save and push to main
          git add -A
          git commit -m "Scaffold complete Pocket Games boilerplate"
          git push origin main
